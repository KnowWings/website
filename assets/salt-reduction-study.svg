<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 520" role="img" aria-labelledby="t d"><title id="t">Salt-reduction formulation study</title><desc id="d">Ingredient options flow into controlled product samples assessed for taste, texture, shelf life and process performance.</desc><defs><linearGradient id="b" x2="1" y2="1"><stop stop-color="#f8fbff"/><stop offset="1" stop-color="#dfeeff"/></linearGradient><linearGradient id="g" x2="1" y2="1"><stop stop-color="#2475ff"/><stop offset="1" stop-color="#0a367f"/></linearGradient></defs><rect width="620" height="520" rx="28" fill="url(#b)"/><g font-family="Arial,sans-serif"><text x="40" y="48" font-size="12" font-weight="700" letter-spacing="2" fill="#4d688b">FORMULATION → VALIDATION</text><text x="40" y="84" font-size="27" font-weight="700" fill="#102a4e">Less salt. The whole product matters.</text><g transform="translate(42 136)"><rect width="116" height="156" rx="22" fill="#fff" stroke="#bdd2ec"/><rect x="18" y="-12" width="80" height="28" rx="8" fill="#315f95"/><text x="58" y="88" text-anchor="middle" font-size="27" font-weight="700" fill="#14528d">NaCl</text><text x="58" y="113" text-anchor="middle" font-size="12" fill="#6b809b">baseline</text></g><path d="M175 215h42m-10-9 10 9-10 9" fill="none" stroke="#145dff" stroke-width="3"/><g transform="translate(242 132)"><rect width="334" height="192" rx="22" fill="#fff" stroke="#c4d8f1"/><text x="22" y="31" font-size="11" letter-spacing="1.5" font-weight="700" fill="#506d92">CONTROLLED SAMPLE COMPARISON</text><g transform="translate(44 95)"><ellipse rx="25" ry="10" fill="#f0d09a"/><path d="M-25 0v24c0 13 50 13 50 0V0" fill="#d9e9fd" stroke="#b9d0ed"/><text y="61" text-anchor="middle" font-size="10" fill="#526d91">BASELINE</text></g><g transform="translate(126 95)"><ellipse rx="25" ry="10" fill="#f0d09a"/><path d="M-25 0v24c0 13 50 13 50 0V0" fill="#d9e9fd" stroke="#b9d0ed"/><text y="61" text-anchor="middle" font-size="10" fill="#526d91">OPTION A</text></g><g transfo